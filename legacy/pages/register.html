<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="إنشاء حساب جديد في حاسباتي — تسجيل مجاني وفوري." />
  <meta name="theme-color" content="#070a12" />
  <title data-en="Create account — Hasibati">إنشاء حساب جديد — حاسباتي</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <script src="../js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
</head>
<body>

  <a class="skip-link" href="#main" data-en="Skip to content">تخطي إلى المحتوى</a>

  <div id="site-nav"></div>

  <main id="main" class="page-wrapper page-enter">
    <div class="auth-wrap">

      <div class="auth-card">
        <div class="auth-logo" aria-hidden="true">✨</div>
        <h1 class="auth-title" data-en="Create a new account">إنشاء حساب جديد</h1>
        <p class="auth-sub" data-en="Free and instant — works on all your devices.">مجاني وفوري — يعمل على جميع أجهزتك.</p>

        <div class="demo-note">
          <span aria-hidden="true">⚠️</span>
          <span data-en="<strong>Real database:</strong> your account is created in Supabase's encrypted database and works on every device."><strong>قاعدة بيانات حقيقية:</strong> يُنشأ حسابك في قاعدة بيانات Supabase المشفرة ويعمل على جميع أجهزتك.</span>
        </div>

        <form id="register-form" novalidate>
          <div class="input-group">
            <label for="reg-name" data-en="Full name">الاسم الكامل</label>
            <input type="text" id="reg-name" placeholder="أدخل اسمك" data-en-ph="Enter your name"
                   autocomplete="name" required />
          </div>

          <div class="input-group">
            <label for="reg-email" data-en="Email address">البريد الإلكتروني</label>
            <input type="email" id="reg-email" placeholder="example@email.com" data-en-ph="example@email.com"
                   autocomplete="email" style="direction:ltr; text-align:left;" required />
          </div>

          <div class="input-group">
            <label for="reg-pass" data-en="Password">كلمة المرور</label>
            <div class="pw-field">
              <input type="password" id="reg-pass" placeholder="••••••••" data-en-ph="••••••••"
                     autocomplete="new-password" required />
              <button type="button" class="pw-toggle" data-pw-toggle="reg-pass"
                      aria-label="إظهار كلمة المرور" data-en-aria="Show password">👁️</button>
            </div>
            <div class="pw-strength" id="reg-strength" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="pw-hint" id="reg-hint" data-en="At least 8 characters with letters and numbers.">8 أحرف على الأقل مع أرقام وحروف.</div>
          </div>

          <div class="input-group">
            <label for="reg-pass2" data-en="Confirm password">تأكيد كلمة المرور</label>
            <div class="pw-field">
              <input type="password" id="reg-pass2" placeholder="••••••••" data-en-ph="••••••••"
                     autocomplete="new-password" required />
              <button type="button" class="pw-toggle" data-pw-toggle="reg-pass2"
                      aria-label="إظهار كلمة المرور" data-en-aria="Show password">👁️</button>
            </div>
          </div>

          <button type="submit" class="btn-primary" style="width:100%; margin-top:0.5rem;" data-en="Create account">إنشاء الحساب</button>

          <div id="register-status" class="form-status" role="status" aria-live="polite"></div>
        </form>

        <div class="auth-alt">
          <span data-en="Already have an account?">لديك حساب بالفعل؟</span>
          <a href="login.html" data-en="Sign in">تسجيل الدخول</a>
        </div>
      </div>

    </div>
  </main>

    <div id="site-footer"></div>

  <script src="../js/site-config.js"></script>

  <script src="../js/layout.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cloud.js"></script>

</body>
</html>
