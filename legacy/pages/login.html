<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="تسجيل الدخول إلى حسابك في حاسباتي — دخول سريع وآمن." />
  <meta name="theme-color" content="#070a12" />
  <title data-en="Sign in — Hasibati">تسجيل الدخول — حاسباتي</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <script src="../js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
</head>
<body>

  <a class="skip-link" href="#main" data-en="Skip to content">تخطي إلى المحتوى</a>

  <div id="site-nav"></div>

  <main id="main" class="page-wrapper page-enter">
    <div class="auth-wrap">

      <div class="auth-card">
        <div class="auth-logo" aria-hidden="true">🔐</div>
        <h1 class="auth-title" data-en="Welcome back">مرحباً بعودتك</h1>
        <p class="auth-sub" data-en="Sign in to your Hasibati account to keep your session.">سجّل الدخول إلى حسابك في حاسباتي للاستمرار في جلستك.</p>

        <div class="demo-note">
          <span aria-hidden="true">⚠️</span>
          <span data-en="<strong>Secure account:</strong> your account is stored in Supabase's encrypted database — never share your password."><strong>حساب آمن:</strong> يُحفظ حسابك في قاعدة بيانات Supabase المشفرة — لا تشارك كلمة مرورك مع أحد.</span>
        </div>

        <form id="login-form" novalidate>
          <div class="input-group">
            <label for="login-email" data-en="Email address">البريد الإلكتروني</label>
            <input type="email" id="login-email" placeholder="example@email.com" data-en-ph="example@email.com"
                   autocomplete="email" style="direction:ltr; text-align:left;" required />
          </div>

          <div class="input-group">
            <label for="login-pass" data-en="Password">كلمة المرور</label>
            <div class="pw-field">
              <input type="password" id="login-pass" placeholder="••••••••" data-en-ph="••••••••"
                     autocomplete="current-password" required />
              <button type="button" class="pw-toggle" data-pw-toggle="login-pass"
                      aria-label="إظهار كلمة المرور" data-en-aria="Show password">👁️</button>
            </div>
          </div>

          <div class="auth-links">
            <label style="display:flex; align-items:center; gap:0.4rem; color:var(--text-secondary); cursor:pointer;">
              <input type="checkbox" id="login-remember" checked style="accent-color:var(--accent); width:16px; height:16px;" />
              <span data-en="Keep me signed in">تذكّرني</span>
            </label>
            <a href="forgot.html" class="hot" data-en="Forgot password?">نسيت كلمة المرور؟</a>
          </div>

          <button type="submit" class="btn-primary" style="width:100%; margin-top:1.1rem;" data-en="Sign in">تسجيل الدخول</button>

          <div id="login-status" class="form-status" role="status" aria-live="polite"></div>
        </form>

        <div class="auth-alt">
          <span data-en="Don't have an account?">ليس لديك حساب؟</span>
          <a href="register.html" data-en="Create one now">أنشئ واحداً الآن</a>
        </div>
      </div>

    </div>
  </main>

    <div id="site-footer"></div>

  <script src="../js/site-config.js"></script>

  <script src="../js/layout.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cloud.js"></script>

</body>
</html>
